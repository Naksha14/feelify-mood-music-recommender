<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feelify Mood Music Recommender</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="splash-screen">
        <h1>Welcome to Feelify!</h1>
    </div>
    <div class="content">
        <h2>Music for Different Moods</h2>
        <h3>Happy</h3>
        <iframe src="https://open.spotify.com/embed/playlist/happy_playlist_id" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
        <h3>Sad</h3>
        <iframe src="https://open.spotify.com/embed/playlist/sad_playlist_id" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
        <h3>Chill</h3>
        <iframe src="https://open.spotify.com/embed/playlist/chill_playlist_id" width="300" height="380" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
    </div>
</body>
</html>
